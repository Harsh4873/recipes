<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f4efe6" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (function () {
        try {
          var theme = 'system';
          var raw = localStorage.getItem('recipes-state-v1');
          if (raw) {
            var parsed = JSON.parse(raw);
            var stored = parsed && parsed.state && parsed.state.settings && parsed.state.settings.theme;
            if (stored === 'light' || stored === 'dark' || stored === 'system') theme = stored;
          }
          if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
          var dark = theme === 'dark' || (theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var color = document.querySelector('meta[name="theme-color"]');
          if (color) color.setAttribute('content', dark ? '#14110e' : '#f4efe6');
          var scheme = document.querySelector('meta[name="color-scheme"]');
          if (scheme) scheme.setAttribute('content', dark ? 'dark' : 'light');
        } catch (error) {}
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Recipes" />
    <meta name="description" content="Swipe through vegetarian lunches and dinners, filter by time and protein, then cook from exact amounts." />
    <meta property="og:title" content="Recipes" />
    <meta property="og:description" content="Swipe through vegetarian meals, then cook from exact amounts." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://harsh.bet/recipes/" />
    <meta property="og:image" content="https://harsh.bet/recipes/social-card.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="canonical" href="https://harsh.bet/recipes/" />
    <link rel="manifest" href="/recipes/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/recipes/favicon.svg" />
    <link rel="apple-touch-icon" href="/recipes/app-icon.svg" />
    <title>Recipes</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Recipes needs JavaScript enabled to browse the meal library and keep favorites on this device.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
